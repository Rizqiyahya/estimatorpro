<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstimatorPro — Pipeline Management</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
</head>
<body>

  <!-- ========== LOGIN GATE ========== -->
  <div id="loginGate" class="login-gate">
    <div class="login-card">
      <div class="login-brand">
        <img src="assets/logo-starcom.png" alt="Starcom Solusindo" class="login-logo-img">
      </div>
      <div class="login-subtitle">PT. Starcom Solusindo</div>
      <div class="login-divider">
        <span class="login-dot netco"></span>
        <span class="login-dot omg"></span>
        <span class="login-dot itsol"></span>
      </div>

      <!-- Login Form -->
      <form id="lgLoginForm" class="login-form" autocomplete="on">
        <label class="login-label">Email</label>
        <input type="email" name="email" placeholder="contoh@starcoms.net" required autocomplete="email" class="login-input">
        <label class="login-label">Password</label>
        <input type="password" name="password" placeholder="••••••" required autocomplete="current-password" class="login-input">
        <div class="login-error" id="lgLoginError"></div>
        <button type="submit" class="login-btn">Sign In</button>
      </form>

      <!-- Register Form (hidden) -->
      <form id="lgRegisterForm" class="login-form" style="display:none" autocomplete="on">
        <label class="login-label">Nama</label>
        <input type="text" name="name" placeholder="Nama lengkap" required class="login-input">
        <label class="login-label">Email</label>
        <input type="email" name="email" placeholder="contoh@starcoms.net" required autocomplete="email" class="login-input">
        <label class="login-label">Password (min. 6 karakter)</label>
        <input type="password" name="password" placeholder="••••••" required minlength="6" class="login-input">
        <div class="login-error" id="lgRegisterError"></div>
        <button type="submit" class="login-btn register-btn">Create Account</button>
      </form>

      <div class="login-toggle" id="lgToggle">
        Belum punya akun? <a href="#" id="lgShowRegister">Register</a>
      </div>
      <div class="login-toggle" id="lgToggleBack" style="display:none">
        Sudah punya akun? <a href="#" id="lgShowLogin">Sign In</a>
      </div>
    </div>
  </div>

  <!-- ========== APP ========== -->

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <img src="assets/logo-starcom.png" alt="Starcom Solusindo" class="brand-logo">
      <div>
        <div class="brand-text">EstimatorPro</div>
        <div class="brand-sub">PT. Starcom Solusindo</div>
      </div>
    </div>
    <!-- User Card -->
    <div class="sidebar-user" id="sidebarUser" style="display:none">
      <div class="sidebar-user-avatar" id="sidebarAvatar">?</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebarUserName">Not signed in</div>
        <div class="sidebar-user-email" id="sidebarUserEmail">Cloud mode</div>
      </div>
      <button class="sidebar-user-logout" id="sidebarLogout" title="Sign out">⏻</button>
    </div>
    <nav class="sidebar-nav">
      <a href="#dashboard" class="nav-item active" data-route="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#requests" class="nav-item" data-route="requests">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
        <span>Requests</span>
        <span class="nav-badge" id="navReqOpen">0</span>
      </a>
      <a href="#tasks" class="nav-item" data-route="tasks">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Tasks</span>
        <span class="nav-badge" id="navTaskActive">0</span>
      </a>
      <a href="#kanban" class="nav-item" data-route="kanban">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="6" rx="2"/><rect x="3" y="13" width="18" height="6" rx="2"/></svg>
        <span>Kanban</span>
      </a>
      <a href="#estimates" class="nav-item" data-route="estimates">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        <span>Estimasi</span>
      </a>
      <a href="#wbs" class="nav-item" data-route="wbs">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>WBS Builder</span>
      </a>
      <a href="#gantt" class="nav-item" data-route="gantt">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="7" y1="10" x2="11" y2="10"/><line x1="7" y1="15" x2="15" y2="15"/><line x1="7" y1="20" x2="18" y2="20"/></svg>
        <span>Gantt Chart</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div id="authArea" style="display:none;padding:6px 8px;margin-bottom:4px">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.75rem" id="userAvatar">?</div>
          <div style="flex:1;overflow:hidden">
            <div style="font-size:0.78rem;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="userName">—</div>
            <div style="font-size:0.65rem;color:var(--text-muted)" id="userRole">—</div>
          </div>
          <button class="btn-xs btn-secondary" onclick="Auth.logout()" title="Sign Out" style="padding:3px 6px;font-size:0.65rem">⏻</button>
        </div>
      </div>
      <a href="#settings" class="nav-item" data-route="settings">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Settings</span>
      </a>
      <button id="themeToggle" class="theme-toggle" title="Toggle Theme">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </aside>

  <header class="mobile-header">
    <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="mobile-brand">📐 EstimatorPro</span>
  </header>

  <main id="mainContent" class="main-content"></main>
  <div id="toastContainer" class="toast-container"></div>
  <div id="modalOverlay" class="modal-overlay hidden">
    <div id="modalBox" class="modal-box"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/requests.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/kanban.js"></script>
  <script src="js/estimates.js"></script>
  <script src="js/wbs.js"></script>
  <script src="js/gantt.js"></script>
  <script src="js/settings.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
